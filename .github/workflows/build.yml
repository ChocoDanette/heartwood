name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: heartwood-jar
          path: build/libs/*.jar
      # Starts a real dedicated NeoForge server with the built jar, lets it generate the
      # spawn area (with its trees) and stops it: catches client-only code reached on a server.
      - name: Dedicated server test
        run: |
          NEO=$(grep '^neo_version=' gradle.properties | cut -d= -f2)
          mkdir -p server && cd server
          curl -sSfLo installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/$NEO/neoforge-$NEO-installer.jar"
          java -jar installer.jar --installServer > install.log
          mkdir -p mods && cp $(ls ../build/libs/*.jar | grep -v -- '-sources') mods/
          echo eula=true > eula.txt
          printf 'online-mode=false\nlevel-seed=heartwood\n' > server.properties
          mkfifo console
          exec 3<>console
          ./run.sh nogui < console > server.log 2>&1 &
          SERVER=$!
          for i in $(seq 1 120); do
            grep -q 'Done (' server.log && break
            kill -0 $SERVER 2>/dev/null || break
            sleep 5
          done
          if grep -q 'Done (' server.log; then echo stop >&3; fi
          timeout 120 tail --pid=$SERVER -f /dev/null || kill $SERVER || true
          tail -n 40 server.log
          grep -q 'Done (' server.log || { echo "Server did not start"; cat crash-reports/* 2>/dev/null; exit 1; }
          if ls crash-reports/* > /dev/null 2>&1; then cat crash-reports/*; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log
          path: server/server.log
          if-no-files-found: ignore
